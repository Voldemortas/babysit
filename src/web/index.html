<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.min.css" />
<script src="https://cdn.jsdelivr.net/npm/uplot/dist/uPlot.iife.min.js"></script>

<div id="chart" style="width: 100%"></div>
<div id="zoomoutinfo">
  Double click to zoom out
</div>
<div style="display: flex; width: 100%; height: calc(100vh - 450px)">
  <div style="width: 50%">
    <h2>Output log</h2>
    <textarea id="stdout" disabled="true" style="width: 100%; height: 100%;">asdas</textarea>
  </div>
  <div style="width: 50%">
    <h2>Error log</h2>
    <textarea id="stderr" disabled="true" style="width: 100%; height: 100%;">asdas</textarea>
  </div>
</div>

<script type="module">
  class Value {
    #value
    #onChange

    constructor(value, onChange) {
      this.#value = value
      this.#onChange = onChange
      onChange(value)
    }

    get value() {
      return this.#value
    }

    set value(value) {
      this.#value = value
      this.#onChange?.(value)
    }
  }

  const intervalTime = +(await (await fetch('/interval')).text())
  const chart = document.querySelector('#chart')
  const zoomoutinfo = document.querySelector('#zoomoutinfo')

  let zoomedIn = new Value(false, v => {
    if(v){
      zoomoutinfo.removeAttribute('style')
    } else {
      zoomoutinfo.setAttribute('style', 'display: none;')
    }
  })

  const plot = new uPlot({
    width: chart.clientWidth-20,
    height: 300,

    series: [
      {},

      {
        label: 'CPU',
        scale: 'cpu',
        stroke: 'red',
        width: 2,
      },

      {
        label: 'RAM',
        scale: 'ram',
        stroke: 'blue',
        width: 2,
      },
    ],

    scales: {
      x: {
        time: true,
      },

      cpu: {
        auto: true,
      },

      ram: {
        auto: true,
      },
    },

    axes: [
      {},

      {
        scale: 'cpu',
        values: (u, values) =>
          values.map(value => `${value}%`),
      },

      {
        scale: 'ram',
        side: 1,
        values: (u, values) =>
          values.map(value => `${(value / 1024 / 1024).toFixed(0)} MB`),
      },
    ],

    hooks: {
      setScale: [
        (u, key) => {
          if (key !== 'x') return

          const x = u.scales.x
          const data = u.data[0]

          if (!data.length) {
            zoomedIn.value = false
            return
          }

          zoomedIn.value =
            x.min > data[0] ||
            x.max < data[data.length - 1]
        },
      ],
    },
  }, [
    [],
    [],
    [],
  ], chart)

  async function updateChart() {
    if (zoomedIn.value) {
      return
    }

    const response = await fetch('/monitor.json')
    const log = await response.json()

    plot.setData([
      log.map(entry => new Date(entry.time).getTime() / 1000),
      log.map(entry => entry.cpu),
      log.map(entry => entry.ram),
    ])
  }

  const resizeObserver = new ResizeObserver(() => {
    plot.setSize({
      width: chart.clientWidth-20,
      height: 300,
    })
  })

  resizeObserver.observe(chart)

  updateChart()
  setInterval(updateChart, intervalTime)
  setInterval(async () => {
    if (zoomedIn.value) {
      return
    }
    document.querySelector('#stdout').value = await (await fetch('/stdout')).text()
  }, intervalTime)
  setInterval(async () => {
    if (zoomedIn.value) {
      return
    }
    document.querySelector('#stderr').value = await (await fetch('/stderr')).text()
  }, intervalTime)
</script>
